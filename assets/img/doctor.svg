<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" role="img" aria-label="Illustration of a physiatrist doctor">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9f3f5"/><stop offset="1" stop-color="#bfe4ff"/></linearGradient>
<linearGradient id="coat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6f3f6"/></linearGradient>
<linearGradient id="scr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e7c86"/><stop offset="1" stop-color="#2f80ed"/></linearGradient>
</defs>
<rect width="420" height="480" rx="22" fill="url(#bg)"/>
<circle cx="340" cy="90" r="70" fill="#fff" opacity=".45"/><circle cx="60" cy="400" r="90" fill="#fff" opacity=".35"/>
<!-- spine chart behind -->
<g opacity=".35" fill="#0e7c86"><rect x="48" y="70" width="26" height="14" rx="6"/><rect x="44" y="90" width="34" height="14" rx="6"/><rect x="48" y="110" width="26" height="14" rx="6"/><rect x="44" y="130" width="34" height="14" rx="6"/><rect x="48" y="150" width="26" height="14" rx="6"/><rect x="44" y="170" width="34" height="14" rx="6"/></g>
<!-- body -->
<path d="M70 480 C70 360 120 320 210 320 C300 320 350 360 350 480Z" fill="url(#coat)" stroke="#cfe3e8" stroke-width="2"/>
<path d="M210 320 L170 480 M210 320 L250 480" stroke="#cfe3e8" stroke-width="2"/>
<path d="M165 322 L210 400 L255 322 L235 318 L210 350 L185 318Z" fill="#0e7c86"/>
<rect x="190" y="300" width="40" height="34" rx="14" fill="#f2c9a5"/>
<!-- head -->
<ellipse cx="210" cy="230" rx="68" ry="78" fill="#f7d3b2"/>
<path d="M142 218 C140 150 190 130 215 135 C262 138 282 175 278 222 C268 190 245 170 212 172 C180 172 156 190 142 218Z" fill="#2b2a33"/>
<ellipse cx="186" cy="236" rx="6" ry="7" fill="#2b2a33"/><ellipse cx="234" cy="236" rx="6" ry="7" fill="#2b2a33"/>
<path d="M190 276 Q210 292 232 276" stroke="#b5654a" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M170 222 Q186 214 200 222 M220 222 Q236 214 252 222" stroke="#2b2a33" stroke-width="4" fill="none" stroke-linecap="round"/>
<!-- glasses -->
<g fill="none" stroke="#0a4f57" stroke-width="3"><rect x="166" y="222" width="40" height="30" rx="12"/><rect x="214" y="222" width="40" height="30" rx="12"/><path d="M206 236h8"/></g>
<!-- stethoscope -->
<path d="M165 330 C150 380 170 420 205 420 C240 420 262 380 255 330" fill="none" stroke="#2b2a33" stroke-width="5" stroke-linecap="round"/>
<circle cx="205" cy="428" r="14" fill="#9fb4bb" stroke="#2b2a33" stroke-width="4"/>
<!-- badge -->
<rect x="262" y="390" width="62" height="34" rx="8" fill="url(#scr)"/><rect x="270" y="398" width="30" height="5" rx="2" fill="#fff"/><rect x="270" y="408" width="44" height="4" rx="2" fill="#fff" opacity=".7"/>
<!-- cross -->
<g transform="translate(300 60)"><rect width="56" height="56" rx="14" fill="#fff" opacity=".9"/><path d="M28 14v28M14 28h28" stroke="#0e7c86" stroke-width="8" stroke-linecap="round"/></g>
</svg>
