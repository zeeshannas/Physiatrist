<rect x="400" y="46" width="120" height="70" rx="8" fill="#fff" stroke="#b9d8de" stroke-width="3"/>
<rect x="414" y="62" width="70" height="7" rx="3" fill="#0e7c86"/><rect x="414" y="78" width="92" height="5" rx="2" fill="#c4dfe4"/><rect x="414" y="90" width="80" height="5" rx="2" fill="#c4dfe4"/>
