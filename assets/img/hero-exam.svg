<path d="M346 246 C342 196 380 184 398 188 C432 192 440 224 438 250 C430 226 414 214 392 214 C370 214 354 228 346 246Z" fill="#26232c"/>
<ellipse cx="376" cy="256" rx="4" ry="5" fill="#26232c"/><ellipse cx="408" cy="256" rx="4" ry="5" fill="#26232c"/>
<path d="M378 284 Q392 294 408 284" stroke="#b5654a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<path d="M326 322 C312 366 332 400 366 400 C398 400 416 370 410 330" fill="none" stroke="#26232c" stroke-width="4" stroke-linecap="round"/>
<circle cx="366" cy="408" r="11" fill="#9fb4bb" stroke="#26232c" stroke-width="3.5"/>
