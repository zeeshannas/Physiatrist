<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-label="Physiatrist examining a patient's spine in a rehabilitation clinic">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6f6f8"/><stop offset="1" stop-color="#d3e9fb"/></linearGradient>
