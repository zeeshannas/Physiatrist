<circle cx="168" cy="308" r="30" fill="none" stroke="#12a4b0" stroke-width="3" stroke-dasharray="6 5"/>
<!-- doctor -->
<path d="M300 450 C300 360 330 318 392 318 C454 318 484 360 484 450Z" fill="url(#coat)" stroke="#c6dde2" stroke-width="2"/>
<path d="M360 320 L392 392 L424 320 L408 316 L392 340 L376 316Z" fill="#0e7c86"/>
<rect x="374" y="296" width="36" height="30" rx="12" fill="#f1c9a6"/>
