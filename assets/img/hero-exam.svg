<linearGradient id="coat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e4f0f3"/></linearGradient>
</defs>
<rect width="560" height="520" rx="26" fill="url(#bg)"/>
<rect y="430" width="560" height="90" fill="#c4dfe4"/>
