<path d="M322 350 C290 352 262 336 240 318" stroke="#e4f0f3" stroke-width="30" stroke-linecap="round" fill="none"/>
<path d="M322 350 C290 352 262 336 240 318" stroke="#c6dde2" stroke-width="2" stroke-linecap="round" fill="none" opacity=".6"/>
<circle cx="236" cy="314" r="13" fill="#f1c9a6"/>
<!-- clipboard -->
<g transform="translate(446 372) rotate(8)"><rect width="52" height="68" rx="6" fill="#fff" stroke="#0e7c86" stroke-width="3"/><rect x="16" y="-6" width="20" height="10" rx="3" fill="#0e7c86"/><rect x="9" y="18" width="34" height="4" rx="2" fill="#b9d8de"/><rect x="9" y="30" width="26" height="4" rx="2" fill="#b9d8de"/><rect x="9" y="42" width="30" height="4" rx="2" fill="#b9d8de"/></g>
